# The version of the plugin. The build file and the release run both read this line, so the
# number stays readable without a Kotlin parser.
pluginVersion=1.0.1
# The changelog plugin builds the compare links from this address, and the IntelliJ Platform
# Gradle Plugin reads exactly this name.
pluginRepositoryUrl=https://github.com/yeskiy/yreview

kotlin.stdlib.default.dependency=false
# The build cache stays off. It served a stale compileTestKotlin output after a
# constructor signature changed, and the test then failed with NoSuchMethodError
# against a class that was correct on disk. A one module build saves little here.
org.gradle.caching=false
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx4g
