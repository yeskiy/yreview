kotlin.stdlib.default.dependency=false
# The build cache stays off. It served a stale compileTestKotlin output after a
# constructor signature changed, and the test then failed with NoSuchMethodError
# against a class that was correct on disk. A one module build saves little here.
org.gradle.caching=false
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx4g
