# The release. A tag that starts with v builds, signs and publishes the plugin.
#
# Every secret comes from the GitHub secret store. The repository holds no key, no
# certificate, and no token. The IntelliJ Platform Gradle Plugin reads the four names
# below from the environment on its own, so the build file declares no signing block and
# no publishing block.
name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:

  release:
    name: Sign and publish the plugin
    runs-on: ubuntu-latest
    steps:
      - name: Free the disk
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # The whole history comes down, because the changelog step reads the earlier tags.
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      # A release must never carry a failing test or a verifier problem. The Marketplace
      # review team runs the same verifier, and a rejected upload costs days.
      - name: Run the tests
        run: ./gradlew test :channel-server:test --console=plain

      - name: Run the JetBrains Plugin Verifier
        run: ./gradlew verifyPlugin --console=plain

      - name: Build and sign the plugin archive
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew buildPlugin signPlugin --console=plain

      # The signPlugin task skips itself without a key, and a skipped task is not an
      # error. This step fails when the signed archive is missing, so an unsigned build
      # can never reach the Marketplace.
      - name: Check the signature
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew verifyPluginSignature --console=plain

      # This task updates a listing that already exists. The first version of a plugin
      # goes through the web form at https://plugins.jetbrains.com/plugin/add .
      - name: Publish the plugin to the JetBrains Marketplace
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin --console=plain

      # The GitHub CLI is on every hosted runner, so this needs no third-party action.
      # The release body comes from CHANGELOG.md through the notes file below.
      - name: Read the change notes of this version
        run: |
          mkdir -p build/tmp
          awk '/^## /{ n++ } n == 1 && !/^## /' CHANGELOG.md > build/tmp/release-notes.md
          test -s build/tmp/release-notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file build/tmp/release-notes.md \
            build/distributions/*.zip
