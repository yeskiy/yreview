# The release. A tag that starts with v builds, signs and publishes the plugin.
#
# Every secret comes from the GitHub secret store. The repository holds no key, no
# certificate, and no token.
#
# Three secrets carry the release: CERTIFICATE_CHAIN, PRIVATE_KEY, and PUBLISH_TOKEN.
# PRIVATE_KEY_PASSWORD stays empty. The signer reads an encrypted key as well, because
# PrivateKeyUtils of marketplace-zip-signer takes a PEMEncryptedKeyPair and a
# PKCS8EncryptedPrivateKeyInfo and decrypts each one with the password. This project ships
# an unencrypted key, because the documented openssl rsa step removes the password and the
# secret store guards the file. An unencrypted key ignores the password, therefore an empty
# secret is correct.
#
# git-cliff writes CHANGELOG.md and the release notes from the commit messages. Both texts
# come from one tool and one configuration, so the release page and the Marketplace listing
# read the same. cliff.toml holds the rule that maps a commit type to a section.
name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  release:
    name: Sign and publish the plugin
    runs-on: ubuntu-latest
    # Only the last step writes to the repository. The right to write stands on the job
    # that needs it, and not on the workflow, so a job added later starts with no right.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Free the disk
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # The whole history comes down, because git-cliff reads every commit and every tag.
      #
      # This checkout keeps the token in .git/config, because the last step pushes the
      # changelog branch. Every checkout in build.yml drops the token instead, because no
      # job there writes to the repository.
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The tag and the build must name one version. The IntelliJ Platform Gradle Plugin
      # reads the change notes for the build version, so two different numbers would carry
      # the notes of an earlier release to the Marketplace.
      - name: Check that the tag and the build name one version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          build_version=$(sed -n 's/^pluginVersion=//p' gradle.properties)
          if [ "$tag_version" != "$build_version" ]; then
            echo "The tag names version $tag_version, and gradle.properties names $build_version." >&2
            echo "Set pluginVersion to $tag_version, then tag the release again." >&2
            exit 1
          fi

      # The two steps below name the tag as the shell variable GITHUB_REF_NAME, and never
      # as the expression github.ref_name. git-cliff-action is a composite action, and it
      # runs "run.sh --config=... ${{ inputs.args }}" in bash. GitHub writes the value of
      # args into that line before bash reads it, so a tag named v1.0.0$(id) would run the
      # command id. A tag takes both forms, because git accepts them in a ref name. Bash
      # expands a variable after it parses the line, therefore the quoted variable stays
      # text. Keep every value that a person controls out of the args input.
      #
      # This step runs before every Gradle task, because the build reads the file it
      # writes. The IntelliJ Platform Gradle Plugin takes the change notes from the section
      # of the build version, therefore the fresh file needs no other wiring.
      - name: Write the changelog from the commit messages
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4.9.0
        with:
          config: cliff.toml
          args: --tag "${GITHUB_REF_NAME}" --output CHANGELOG.md

      # The release page takes the section of this tag alone. The header of the file holds
      # the title and the Unreleased heading, and neither one belongs on a release page.
      - name: Write the release notes of this tag
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4.9.0
        with:
          config: cliff.toml
          args: --tag "${GITHUB_REF_NAME}" --latest --strip header --output "${RUNNER_TEMP}/release-notes-raw.md"

      # The Gradle plugin renders the Marketplace listing without the version heading. The
      # first command drops the same heading from the release notes, and the second drops
      # the blank lines above the first section, so both pages read the same.
      #
      # Two guards stood here before. One asked that the file holds a section for this tag,
      # and the other asked that the Unreleased section is empty. Both watched a person who
      # promotes a section by hand. A generator writes the section of the tag on every run
      # and leaves nothing under Unreleased, so neither guard can fail now. The guard below
      # catches the failure that remains. Every commit of a tag can carry a type that
      # cliff.toml skips, and the release page would then carry no text at all.
      - name: Read the release notes
        run: |
          sed -e '0,/^## \[/d' "${RUNNER_TEMP}/release-notes-raw.md" \
            | sed -e '/./,$!d' > "${RUNNER_TEMP}/release-notes.md"
          if [ -z "$(tr -d "[:space:]" < "${RUNNER_TEMP}/release-notes.md")" ]; then
            echo "git-cliff wrote no entry for ${GITHUB_REF_NAME}." >&2
            echo "Every commit of this tag carries a type that cliff.toml skips." >&2
            exit 1
          fi
          cat "${RUNNER_TEMP}/release-notes.md"

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      # A release must never carry a failing test or a verifier problem. The Marketplace
      # review team runs the same verifier, and a rejected upload costs days.
      - name: Run the tests
        run: ./gradlew test :channel-server:test --console=plain

      - name: Run the JetBrains Plugin Verifier
        run: ./gradlew verifyPlugin --console=plain

      # The certificate chain reaches the build as a file, and never as an inline value.
      # The verify task passes an inline chain twice, and the second copy starts with a
      # hyphen, so the argument parser of the signer stops with "Invalid argument". A file
      # reaches that task once. The secret holds the chain in PEM form, or in base64, and
      # this step writes the PEM form either way. It prints no part of the secret.
      - name: Write the certificate chain to a file
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
        run: |
          umask 077
          chain="${RUNNER_TEMP}/certificate-chain.pem"
          printf '%s\n' "$CERTIFICATE_CHAIN" | base64 -d > "$chain" 2>/dev/null \
            || printf '%s\n' "$CERTIFICATE_CHAIN" > "$chain"
          grep -q "BEGIN CERTIFICATE" "$chain" || {
            echo "The CERTIFICATE_CHAIN secret holds no PEM certificate."
            exit 1
          }
          echo "CERTIFICATE_CHAIN_FILE=$chain" >> "$GITHUB_ENV"

      - name: Build and sign the plugin archive
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew buildPlugin signPlugin --console=plain

      # Without a key the signPlugin task skips itself, and Gradle then reports
      # verifyPluginSignature as NO-SOURCE and passes. That task alone therefore lets
      # an unsigned build through. The archive is counted first, so a missing
      # signature stops the run here.
      - name: Check the signature
        run: |
          count=$(ls build/distributions/*-signed.zip 2>/dev/null | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "Expected one signed archive under build/distributions, and found $count."
            echo "The signing step did not run, so this build must not reach the Marketplace."
            exit 1
          fi
          ./gradlew verifyPluginSignature --console=plain

      # This task updates a listing that already exists. The first version of a plugin
      # goes through the web form at https://plugins.jetbrains.com/plugin/add .
      - name: Publish the plugin to the JetBrains Marketplace
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin --console=plain

      # The GitHub CLI is on every hosted runner, so this needs no third-party action.
      # The tag names the release, therefore the body carries no version heading.
      #
      # The env block carries the tag into the script as a variable, and the script reads
      # it between double quotes. GitHub writes the value of an expression into the script
      # text before bash reads that text, so the expression github.ref_name here would run
      # the command in a tag named v1.0.0$(id). Git accepts such a name for a tag. Bash
      # expands a variable after it parses the line, therefore the value stays text.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            build/distributions/*-signed.zip

      # The file in the repository must carry the release that shipped. This job starts on
      # a tag, which leaves the checkout on no branch, so the step reads main and writes the
      # generated file over the one that main holds.
      #
      # A branch ruleset on main asks for a pull request. The GitHub Actions app cannot hold
      # a bypass of that ruleset, because a personal repository has no organization to name
      # the app in. The API answers "must be part of the ruleset source or owner
      # organization". For this reason the step pushes a side branch and merges a pull
      # request. The ruleset covers the default branch alone, so the push of the side branch
      # passes. The rule asks for zero approving reviews, so the merge needs no person.
      #
      # The checkout moves back to main before the merge. The gh command deletes the local
      # branch, and a branch that is not checked out needs no other git step.
      #
      # The commit takes the type docs, which cliff.toml skips, therefore this commit never
      # reaches the changelog of the next release. The squash carries the same subject, so
      # the commit on main keeps that type.
      - name: Write the changelog back to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp CHANGELOG.md "${RUNNER_TEMP}/CHANGELOG.md"
          git fetch --no-tags origin main
          git checkout -f -B main origin/main
          cp "${RUNNER_TEMP}/CHANGELOG.md" CHANGELOG.md
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md on main already carries the notes of ${GITHUB_REF_NAME}."
            exit 0
          fi
          branch="chore/changelog-${GITHUB_REF_NAME}"
          subject="docs: write the changelog of ${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git commit --only CHANGELOG.md -m "$subject"
          git push origin "$branch"
          git checkout main
          gh pr create --base main --head "$branch" --title "$subject" \
            --body "The release of ${GITHUB_REF_NAME} wrote this file from the commit messages."
          gh pr merge "$branch" --squash --delete-branch --subject "$subject" --body ""
