# The release. A tag that starts with v builds, signs and publishes the plugin.
#
# Every secret comes from the GitHub secret store. The repository holds no key, no
# certificate, and no token.
#
# Three secrets carry the release: CERTIFICATE_CHAIN, PRIVATE_KEY, and PUBLISH_TOKEN.
# PRIVATE_KEY_PASSWORD stays empty. The signer cannot read an encrypted key on a plain
# runtime, so the documented openssl rsa step removes the password from the key. An
# unencrypted key ignores the password, therefore an empty secret is correct.
name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:

  release:
    name: Sign and publish the plugin
    runs-on: ubuntu-latest
    steps:
      - name: Free the disk
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # The whole history comes down, because the changelog step reads the earlier tags.
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      # A release must never carry a failing test or a verifier problem. The Marketplace
      # review team runs the same verifier, and a rejected upload costs days.
      - name: Run the tests
        run: ./gradlew test :channel-server:test --console=plain

      - name: Run the JetBrains Plugin Verifier
        run: ./gradlew verifyPlugin --console=plain

      # The certificate chain reaches the build as a file, and never as an inline value.
      # The verify task passes an inline chain twice, and the second copy starts with a
      # hyphen, so the argument parser of the signer stops with "Invalid argument". A file
      # reaches that task once. The secret holds the chain in PEM form, or in base64, and
      # this step writes the PEM form either way. It prints no part of the secret.
      - name: Write the certificate chain to a file
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
        run: |
          umask 077
          chain="${RUNNER_TEMP}/certificate-chain.pem"
          printf '%s\n' "$CERTIFICATE_CHAIN" | base64 -d > "$chain" 2>/dev/null \
            || printf '%s\n' "$CERTIFICATE_CHAIN" > "$chain"
          grep -q "BEGIN CERTIFICATE" "$chain" || {
            echo "The CERTIFICATE_CHAIN secret holds no PEM certificate."
            exit 1
          }
          echo "CERTIFICATE_CHAIN_FILE=$chain" >> "$GITHUB_ENV"

      - name: Build and sign the plugin archive
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew buildPlugin signPlugin --console=plain

      # Without a key the signPlugin task skips itself, and Gradle then reports
      # verifyPluginSignature as NO-SOURCE and passes. That task alone therefore lets
      # an unsigned build through. The archive is counted first, so a missing
      # signature stops the run here.
      - name: Check the signature
        run: |
          count=$(ls build/distributions/*-signed.zip 2>/dev/null | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "Expected one signed archive under build/distributions, and found $count."
            echo "The signing step did not run, so this build must not reach the Marketplace."
            exit 1
          fi
          ./gradlew verifyPluginSignature --console=plain

      # This task updates a listing that already exists. The first version of a plugin
      # goes through the web form at https://plugins.jetbrains.com/plugin/add .
      - name: Publish the plugin to the JetBrains Marketplace
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin --console=plain

      # The GitHub CLI is on every hosted runner, so this needs no third-party action.
      # The tag names the release, therefore the body carries no header line and no link
      # list.
      #
      # Two guards stand here, because the old step could pass while it shipped the wrong
      # text. It asked for no version, so the task answered the newest released section,
      # which stays the same when nobody promotes the Unreleased heading. The only check
      # was test -s, and a section of an earlier version is not empty, so a release could
      # carry the notes of the version before it and report success.
      - name: Read the change notes of this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The notes must belong to the tag that is being released. A missing section
          # stops the release instead of falling back to an earlier one.
          ./gradlew getChangelog --project-version="$version" --no-header --no-links --output-file build/tmp/release-notes.md --console=plain
          test -s build/tmp/release-notes.md
          # Anything left under Unreleased means the promotion never ran, so the notes of
          # this tag are short by everything written since the last release.
          ./gradlew getChangelog --unreleased --no-header --no-links --output-file build/tmp/unreleased.md --console=plain
          if [ -s build/tmp/unreleased.md ]; then
            echo "CHANGELOG.md still holds entries under Unreleased." >&2
            echo "Move them under $version before you tag the release." >&2
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file build/tmp/release-notes.md \
            build/distributions/*-signed.zip
